<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto">Velonith — Professional Logo v3</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto">Velonith brand logo. Deep space background card with a sharp geometric V-mark in a purple-to-cyan gradient, bold tracked wordmark, gradient rule, and CODE WITHOUT BOUNDARIES tagline. Corner accent dots and subtle grid lines complete the professional layout.</desc>

  <defs>
    <!-- Primary brand gradient: purple → cyan -->
    <linearGradient id="grad-mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Wordmark gradient: white → soft blue-white -->
    <linearGradient id="grad-wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F4FF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Horizontal rule gradient -->
    <linearGradient id="grad-rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09090B" stop-opacity="1"/>
      <stop offset="22%" stop-color="#7C3AED" stop-opacity="1"/>
      <stop offset="78%" stop-color="#06B6D4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="1"/>
    </linearGradient>

    <!-- Ambient top glow -->
    <radialGradient id="grad-glow" cx="50%" cy="0%" r="65%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- Card clip -->
    <clipPath id="clip-card">
      <rect x="50" y="18" width="580" height="444" rx="22"/>
    </clipPath>

    <!-- Mark glow filter substitute: soft halo via layered circles (no filter) -->
    <!-- Subtle dot pattern for texture -->
    <pattern id="dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.75" fill="#FFFFFF" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- ─── Card background ─────────────────────────────────── -->
  <rect x="50" y="18" width="580" height="444" rx="22" fill="#0A0A0F" style="fill:rgb(10, 10, 15);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Ambient glow layer -->
  <rect x="50" y="18" width="580" height="444" rx="22" fill="url(#grad-glow)" clip-path="url(#clip-card)" style="stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Dot grid texture -->
  <rect x="50" y="18" width="580" height="444" rx="22" fill="url(#dot-grid)" clip-path="url(#clip-card)" style="stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ─── Subtle alignment grid lines ───────────────────────── -->
  <!-- horizontal guards -->
  <line x1="72" y1="57" x2="608" y2="57" stroke="#1D1D2B" stroke-width="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(29, 29, 43);color:rgb(251, 251, 254);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="72" y1="423" x2="608" y2="423" stroke="#1D1D2B" stroke-width="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(29, 29, 43);color:rgb(251, 251, 254);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- vertical guards -->
  <line x1="110" y1="18" x2="110" y2="462" stroke="#1D1D2B" stroke-width="0.4" style="fill:rgb(0, 0, 0);stroke:rgb(29, 29, 43);color:rgb(251, 251, 254);stroke-width:0.4px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="570" y1="18" x2="570" y2="462" stroke="#1D1D2B" stroke-width="0.4" style="fill:rgb(0, 0, 0);stroke:rgb(29, 29, 43);color:rgb(251, 251, 254);stroke-width:0.4px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ─── Card border ─────────────────────────────────────── -->
  <rect x="50" y="18" width="580" height="444" rx="22" fill="none" stroke="#7C3AED" stroke-width="0.9" opacity="0.55" style="fill:none;stroke:rgb(124, 58, 237);color:rgb(251, 251, 254);stroke-width:0.9px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.55;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ─── Corner accent dots ─────────────────────────────── -->
  <circle cx="72" cy="38" r="3.5" fill="#7C3AED" opacity="0.8" style="fill:rgb(124, 58, 237);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.8;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="608" cy="38" r="3.5" fill="#06B6D4" opacity="0.8" style="fill:rgb(6, 182, 212);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.8;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="72" cy="442" r="3.5" fill="#06B6D4" opacity="0.8" style="fill:rgb(6, 182, 212);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.8;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="608" cy="442" r="3.5" fill="#7C3AED" opacity="0.8" style="fill:rgb(124, 58, 237);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.8;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ─── Decorative orbit rings (very subtle) ───────────── -->
  <circle cx="340" cy="195" r="105" fill="none" stroke="#7C3AED" stroke-width="0.35" opacity="0.18" style="fill:none;stroke:rgb(124, 58, 237);color:rgb(251, 251, 254);stroke-width:0.35px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.18;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="340" cy="195" r="145" fill="none" stroke="#06B6D4" stroke-width="0.25" opacity="0.1" style="fill:none;stroke:rgb(6, 182, 212);color:rgb(251, 251, 254);stroke-width:0.25px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ─── V-mark icon ────────────────────────────────────── -->
  <!-- Ghost fill for depth -->
  <path d="M253,68 L340,228 L427,68 Z" fill="#7C3AED" opacity="0.055" style="fill:rgb(124, 58, 237);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.055;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Left serif accent (top-left corner bracket) -->
  <line x1="253" y1="68" x2="236" y2="68" stroke="#7C3AED" stroke-width="2" opacity="0.6" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(124, 58, 237);color:rgb(251, 251, 254);stroke-width:2px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="253" y1="68" x2="253" y2="51" stroke="#7C3AED" stroke-width="2" opacity="0.6" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(124, 58, 237);color:rgb(251, 251, 254);stroke-width:2px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Right serif accent (top-right corner bracket) -->
  <line x1="427" y1="68" x2="444" y2="68" stroke="#06B6D4" stroke-width="2" opacity="0.6" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(6, 182, 212);color:rgb(251, 251, 254);stroke-width:2px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="427" y1="68" x2="427" y2="51" stroke="#06B6D4" stroke-width="2" opacity="0.6" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(6, 182, 212);color:rgb(251, 251, 254);stroke-width:2px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Main V strokes — thicker, cleaner, with gradient -->
  <path d="M253,68 L340,228 L427,68" fill="none" stroke="url(#grad-mark)" stroke-width="18" stroke-linecap="butt" stroke-linejoin="miter" style="fill:none;color:rgb(251, 251, 254);stroke-width:18px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Inner V highlight — adds depth -->
  <path d="M253,68 L340,228 L427,68" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter" opacity="0.12" style="fill:none;stroke:rgb(255, 255, 255);color:rgb(251, 251, 254);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.12;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- V bottom apex: precision dot -->
  <circle cx="340" cy="228" r="7" fill="#06B6D4" style="fill:rgb(6, 182, 212);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="340" cy="228" r="13" fill="none" stroke="#06B6D4" stroke-width="0.9" opacity="0.4" style="fill:none;stroke:rgb(6, 182, 212);color:rgb(251, 251, 254);stroke-width:0.9px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.4;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="340" cy="228" r="21" fill="none" stroke="#06B6D4" stroke-width="0.4" opacity="0.18" style="fill:none;stroke:rgb(6, 182, 212);color:rgb(251, 251, 254);stroke-width:0.4px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.18;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ─── Wordmark ─────────────────────────────────────────── -->
  <text x="340" y="305" font-family="'Segoe UI', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="60" font-weight="700" fill="url(#grad-wordmark)" text-anchor="middle" letter-spacing="10" style="stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Segoe UI&quot;, &quot;Helvetica Neue&quot;, Arial, system-ui, sans-serif;font-size:60px;font-weight:700;text-anchor:middle;dominant-baseline:auto">VELONITH</text>

  <!-- ─── Gradient divider rule ─────────────────────────────── -->
  <rect x="165" y="317" width="350" height="1.5" rx="0.75" fill="url(#grad-rule)" style="stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ─── Tagline ────────────────────────────────────────────── -->
  <text x="340" y="342" font-family="'Courier New', 'Courier', monospace" font-size="11.5" font-weight="400" fill="#06B6D4" text-anchor="middle" letter-spacing="5.5" opacity="0.9" style="fill:rgb(6, 182, 212);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.9;font-family:&quot;Courier New&quot;, &quot;Courier&quot;, monospace;font-size:11.5px;font-weight:400;text-anchor:middle;dominant-baseline:auto">CODE WITHOUT BOUNDARIES</text>

  <!-- ─── Thin separator before sub-brand row ──────────────── -->
  <rect x="196" y="367" width="288" height="0.5" fill="#1E1E30" style="fill:rgb(30, 30, 48);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ─── Sub-brand row: LABS · STUDIO · CLOUD ──────────────── -->
  <text x="252" y="393" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#7C3AED" text-anchor="middle" letter-spacing="3.5" style="fill:rgb(124, 58, 237);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Segoe UI&quot;, system-ui, sans-serif;font-size:10.5px;font-weight:600;text-anchor:middle;dominant-baseline:auto">LABS</text>

  <line x1="291" y1="384" x2="291" y2="400" stroke="#2A2A3E" stroke-width="0.8" style="fill:rgb(0, 0, 0);stroke:rgb(42, 42, 62);color:rgb(251, 251, 254);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <text x="340" y="393" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#444466" text-anchor="middle" letter-spacing="3.5" style="fill:rgb(68, 68, 102);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Segoe UI&quot;, system-ui, sans-serif;font-size:10.5px;font-weight:400;text-anchor:middle;dominant-baseline:auto">STUDIO</text>

  <line x1="389" y1="384" x2="389" y2="400" stroke="#2A2A3E" stroke-width="0.8" style="fill:rgb(0, 0, 0);stroke:rgb(42, 42, 62);color:rgb(251, 251, 254);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <text x="430" y="393" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#444466" text-anchor="middle" letter-spacing="3.5" style="fill:rgb(68, 68, 102);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Segoe UI&quot;, system-ui, sans-serif;font-size:10.5px;font-weight:400;text-anchor:middle;dominant-baseline:auto">CLOUD</text>

</svg>